id: e3-h-mini-qwen3-coder
task_set: v1
tier: screening3
timeout_s: 1800
notes: >-
  E3 harness comparison at the E1 uma24 layout (BIOS UMA 24 GiB, default GTT): mini-swe-agent 2.4.6 instead of
  OpenCode, Ollama 0.34.4, 64k context, llama-server prompt cache capped at 1024 MiB. 30-minute attempt limit (no OpenCode pass took over 24). Compare with
  e3-cap-qwen3-coder (OpenCode, same model and caps).
host: {vram_gib: 24, gtt_gib: 3.7}
runtime:
  kind: ollama
  model: qwen3-coder:30b
  context: 65536
  env: {LLAMA_ARG_CACHE_RAM: "1024"}
agent:
  kind: command
  name: mini-swe-agent
  version: 2.4.6
  command: >-
    MSWEA_CONFIGURED=true MSWEA_COST_TRACKING=ignore_errors OPENAI_API_KEY=local
    /srv/agentbench/opt/bin/mini -y --exit-immediately -l 0 -m openai/{model}
    -c mini.yaml -c model.model_kwargs.api_base={endpoint}/v1 -o /tmp/mini-traj.json -t "$(cat {issue_file})"
  steps_regex: 'mini-swe-agent \(step \d+'
