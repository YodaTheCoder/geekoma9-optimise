id: e3-screen-laguna
task_set: v1
tier: screening3
notes: >-
  E3 model screen at the E1 uma24 layout (BIOS UMA 24 GiB, default GTT), OpenCode 1.18.32, Ollama
  0.34.4, 64k context, 3 runs per screening task. Only the model differs between e3-screen-* configs.
host: {vram_gib: 24, gtt_gib: 3.7}
runtime:
  kind: ollama
  model: laguna-xs-2.1:q4_K_M
  context: 65536
agent:
  kind: command
  name: opencode
  version: 1.18.32
  command: >-
    BENCH_ENDPOINT={endpoint} OPENCODE_CONFIG="$HOME/.config/agentbench/opencode.json"
    opencode run --auto --format json --dir {workdir} -m bench/{model} "$(cat {issue_file})"
  steps_regex: '"type":"tool_use"'
