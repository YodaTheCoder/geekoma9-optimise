id: e5r2-vk-qwen-ctx32k
task_set: v1
tier: finalists
notes: >-
  E5 finalists with llama.cpp Vulkan at the E1 uma24 layout (BIOS UMA 24 GiB, default GTT), OpenCode 1.18.32, llama.cpp b12191 Vulkan (RADV)
  llama-server instead of Ollama 0.34.4, same GGUF file as the Ollama model, 32k context, f16 KV,
  prompt cache capped at 1024 MiB. Sampling as in the Ollama modelfile. All 12 tasks x 3, 45-minute limit. Repeat of e5-vk-qwen-ctx32k; compare with e5r2-qwen-ctx32k.
host: {vram_gib: 24, gtt_gib: 3.7}
runtime:
  kind: llamacpp
  model: qwen3-coder:30b
  context: 32768
  server: /srv/agentbench/opt/llama/vulkan-b12191/llama-b12191/llama-server
  gguf: /usr/share/ollama/.ollama/models/blobs/sha256-1194192cf2a187eb02722edcc3f77b11d21f537048ce04b67ccf8ba78863006a
  args: ["--temp", "0.7", "--top-p", "0.8", "--top-k", "20", "--min-p", "0", "--repeat-penalty", "1.05"]
  env: {LLAMA_ARG_CACHE_RAM: "1024"}
agent:
  kind: command
  name: opencode
  version: 1.18.32
  command: >-
    BENCH_ENDPOINT={endpoint} OPENCODE_CONFIG="$HOME/.config/agentbench/opencode.json"
    opencode run --auto --format json --dir {workdir} -m bench/{model} "$(cat {issue_file})"
  steps_regex: '"type":"tool_use"'
