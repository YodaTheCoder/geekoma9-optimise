[project]
name = "harness"
version = "0.1.0"
description = "Benchmark harness for local coding-agent configurations"
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["pyyaml"]

[project.scripts]
harness = "harness.cli:main"

[dependency-groups]
dev = ["pytest"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["harness"]

[tool.pytest.ini_options]
testpaths = ["tests"]
